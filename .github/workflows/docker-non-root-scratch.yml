name: Docker - non-root-scratch (Go scratch webapp, numeric UID)

on:
  push:
    branches: ["main"]
    paths:
      - "dockerfiles/Dockerfile.non-root-scratch"
      - ".github/workflows/docker-non-root-scratch.yml"
  pull_request:
    paths:
      - "dockerfiles/Dockerfile.non-root-scratch"
      - ".github/workflows/docker-non-root-scratch.yml"
  workflow_dispatch:

concurrency:
  group: docker-non-root-scratch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build${{ github.ref == 'refs/heads/main' && ' & Push' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU (cross-platform emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image name (lowercased, nested under repo)
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LC}/non-root-scratch-webapp" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: dockerfiles
          file: dockerfiles/Dockerfile.non-root-scratch
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=non-root-scratch-webapp
          cache-to: type=gha,mode=max,scope=non-root-scratch-webapp

      - name: Test - HTTP response
        if: success()
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file dockerfiles/Dockerfile.non-root-scratch \
            --load \
            --tag non-root-scratch-webapp:ci \
            dockerfiles

          docker run --rm -d --name non-root-scratch-ci -p 8080:8080 non-root-scratch-webapp:ci
          sleep 2
          RESPONSE=$(curl -sf http://localhost:8080)
          docker stop non-root-scratch-ci
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q "Hello, World!" || \
            { echo "Unexpected response: $RESPONSE"; exit 1; }

      - name: Verify image is configured with non-root numeric UID
        if: success()
        run: |
          CONFIGURED_USER=$(docker inspect non-root-scratch-webapp:ci --format '{{.Config.User}}')
          echo "Image USER = $CONFIGURED_USER"
          # Expect "1001:1001" (or just "1001") - anything non-empty and non-zero
          [ -n "$CONFIGURED_USER" ] || { echo "ERROR: USER not set in image config"; exit 1; }
          echo "$CONFIGURED_USER" | grep -qv '^0' || { echo "ERROR: image runs as root (UID 0)"; exit 1; }
