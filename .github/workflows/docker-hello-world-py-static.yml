name: Docker - hello-world (Python PyInstaller + staticx / scratch)

on:
  push:
    branches: ["main"]
    paths:
      - "dockerfiles/hello-world/Dockerfile.py-static"
      - "dockerfiles/hello-world/src/hello.py"
      - ".github/workflows/docker-hello-world-py-static.yml"
  pull_request:
    paths:
      - "dockerfiles/hello-world/Dockerfile.py-static"
      - "dockerfiles/hello-world/src/hello.py"
      - ".github/workflows/docker-hello-world-py-static.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hello-world-py-static

jobs:
  build:
    name: Build${{ github.ref == 'refs/heads/main' && ' & Push' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: dockerfiles/hello-world
          file: dockerfiles/hello-world/Dockerfile.py-static
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test - Output
        if: success()
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file dockerfiles/hello-world/Dockerfile.py-static \
            --load \
            --tag hello-world-py-static:ci \
            dockerfiles/hello-world

          OUTPUT=$(docker run --rm hello-world-py-static:ci)
          echo "Output: $OUTPUT"
          echo "$OUTPUT" | grep -q "Python Container" || \
            { echo "ERROR: unexpected output"; exit 1; }
