name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/render_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install MkDocs Material
        run: pip install "mkdocs-material~=9.7"
      # Render Markdown docs for MkDocs (alerts, blank lines, source links)
      - name: Render docs for MkDocs
        run: >
          python3 .github/render_docs.py
          --docs docs
          --root .
          --repo-url https://github.com/${{ github.repository }}
          --repo-branch ${{ github.ref_name }}
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
