name: Docker - dns-utils (Alpine)

on:
  push:
    branches: ["main"]
    paths:
      - "dockerfiles/Dockerfile.dns-utils"
      - ".github/workflows/docker-dns-utils.yml"
  pull_request:
    paths:
      - "dockerfiles/Dockerfile.dns-utils"
      - ".github/workflows/docker-dns-utils.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dns-utils

jobs:
  build:
    name: Build${{ github.ref == 'refs/heads/main' && ' & Push' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU (cross-platform emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: dockerfiles
          file: dockerfiles/Dockerfile.dns-utils
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test - dig & drill
        if: success()
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file dockerfiles/Dockerfile.dns-utils \
            --load \
            --tag dns-utils:ci \
            dockerfiles

          docker run --rm dns-utils:ci dig +short google.com | grep -E '^[0-9]+\.' || \
            { echo "dig returned no A records"; exit 1; }

          docker run --rm dns-utils:ci drill google.com | grep -E 'ANSWER SECTION' || \
            { echo "drill returned no answer section"; exit 1; }
