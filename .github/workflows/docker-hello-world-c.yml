name: Docker - hello-world (C / scratch)

on:
  push:
    branches: ["main"]
    paths:
      - "dockerfiles/hello-world/Dockerfile.c"
      - "dockerfiles/hello-world/src/hello.c"
      - ".github/workflows/docker-hello-world-c.yml"
  pull_request:
    paths:
      - "dockerfiles/hello-world/Dockerfile.c"
      - "dockerfiles/hello-world/src/hello.c"
      - ".github/workflows/docker-hello-world-c.yml"
  workflow_dispatch:

concurrency:
  group: docker-hello-world-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build${{ github.ref == 'refs/heads/main' && ' & Push' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU (cross-platform emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image name (lowercased, nested under repo)
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LC}/hello-world-c" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: dockerfiles/hello-world
          file: dockerfiles/hello-world/Dockerfile.c
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hello-world-c
          cache-to: type=gha,mode=max,scope=hello-world-c

      - name: Test - amd64
        if: success()
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file dockerfiles/hello-world/Dockerfile.c \
            --load \
            --tag hello-world-c:ci-amd64 \
            dockerfiles/hello-world

          OUTPUT=$(docker run --rm hello-world-c:ci-amd64)
          echo "Output: $OUTPUT"
          echo "$OUTPUT" | grep -q "C Container" || \
            { echo "ERROR: expected 'C Container' in output"; exit 1; }
          echo "$OUTPUT" | grep -q "Linux" || \
            { echo "ERROR: expected 'Linux' in output"; exit 1; }
          echo "$OUTPUT" | grep -q "x86_64" || \
            { echo "ERROR: expected 'x86_64' in output"; exit 1; }

      - name: Test - arm64
        if: success()
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file dockerfiles/hello-world/Dockerfile.c \
            --load \
            --tag hello-world-c:ci-arm64 \
            dockerfiles/hello-world

          OUTPUT=$(docker run --rm --platform linux/arm64 hello-world-c:ci-arm64)
          echo "Output: $OUTPUT"
          echo "$OUTPUT" | grep -q "C Container" || \
            { echo "ERROR: expected 'C Container' in arm64 output"; exit 1; }
          echo "$OUTPUT" | grep -iEq "ARM64|AArch64" || \
            { echo "ERROR: expected ARM64/AArch64 architecture in arm64 output"; exit 1; }

      - name: Prune builder image layers
        if: always()
        run: docker image prune --force --filter label=stage=builder
