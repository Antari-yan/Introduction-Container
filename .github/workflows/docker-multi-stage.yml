name: Docker - multi-stage (Go scratch webapp)

on:
  push:
    branches: ["main"]
    paths:
      - "dockerfiles/Dockerfile.multi-stage"
      - ".github/workflows/docker-multi-stage.yml"
  pull_request:
    paths:
      - "dockerfiles/Dockerfile.multi-stage"
      - ".github/workflows/docker-multi-stage.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/multi-stage-webapp

jobs:
  build:
    name: Build${{ github.ref == 'refs/heads/main' && ' & Push' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU (cross-platform emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: dockerfiles
          file: dockerfiles/Dockerfile.multi-stage
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test - HTTP response
        if: success()
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file dockerfiles/Dockerfile.multi-stage \
            --load \
            --tag multi-stage-webapp:ci \
            dockerfiles

          docker run --rm -d --name multi-stage-ci -p 8080:8080 multi-stage-webapp:ci
          sleep 2
          RESPONSE=$(curl -sf http://localhost:8080)
          docker stop multi-stage-ci
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q "Hello, World!" || \
            { echo "Unexpected response: $RESPONSE"; exit 1; }

      - name: Verify scratch image has no shell
        if: success()
        run: |
          docker run --rm multi-stage-webapp:ci /bin/sh 2>&1 | grep -q "no such file\|exec format error\|not found" || \
            docker inspect multi-stage-webapp:ci \
              --format '{{range .RootFS.Layers}}{{println .}}{{end}}' | wc -l | \
              xargs -I{} test {} -le 2  # scratch images have at most 1-2 layers
