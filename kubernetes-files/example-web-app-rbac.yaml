# Identity and permissions for the web app.
# The app uses this to call the Kubernetes API on its /pods endpoint.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-web-app
  namespace: example-web-app
  labels:
    app: example-web-app

---
# Read-only access to pods in this namespace (least privilege).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: example-web-app-pod-reader
  namespace: example-web-app
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: example-web-app-pod-reader
  namespace: example-web-app
subjects:
  - kind: ServiceAccount
    name: example-web-app
    namespace: example-web-app
roleRef:
  kind: Role
  name: example-web-app-pod-reader
  apiGroup: rbac.authorization.k8s.io
