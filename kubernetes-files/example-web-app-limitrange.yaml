# Default resource limitations for each container in the namepspace
# Containers that omit requests/limits get these default values, values above max are rejected.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: example-web-app-limits
  namespace: example-web-app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 200m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 256Mi
