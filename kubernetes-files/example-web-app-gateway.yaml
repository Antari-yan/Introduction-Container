# Gateway API equivalent of example-web-app-ingress.yaml.
# It uses its own host so it can run alongside the Ingress without both claiming the same one.
# The Gateway API CRDs ship with k3s but the Traefik Gateway provider needs to be enabled via kubernetes-bootstrap/traefik-gateway-config.yaml.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-web-app
  namespace: example-web-app
spec:
  gatewayClassName: traefik   # Provided by Traefik once the Gateway provider is enabled (kubectl get gatewayclass)
  listeners:
    - name: web
      protocol: HTTP
      # Must equal the Traefik "web" entrypoint port.
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-web-app
  namespace: example-web-app
spec:
  parentRefs:
    - name: example-web-app
  hostnames:
    - example-web-app-gateway.k3d.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: example-web-app
          port: 8080