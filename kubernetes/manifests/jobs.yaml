# Batch workloads that interact with the running web app.
---
# One-off Job: A test against the app.
# It is applied together with the app, so it would race the Deployment becoming ready.
# curl therefore retries internally (also on connection-refused) until the Service has ready endpoints,
# instead of failing the race and burning through the Job's backoffLimit.
apiVersion: batch/v1
kind: Job
metadata:
  name: example-web-app-test
  namespace: example-web-app
spec:
  backoffLimit: 3 # How often the job is allowed to fail
  template:
    metadata:
      labels:
        access: example-web-app
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: docker.io/curlimages/curl:latest
          args:
            - "--retry"
            - "10"
            - "--retry-all-errors"   # Retry on connection-refused and HTTP errors too
            - "--retry-delay"
            - "5"
            - "--fail"
            - "--silent"
            - "--show-error"
            - "http://example-web-app:8080/healthz"

---
# CronJob: A job that runs with a periodic schedule.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: example-web-app-heartbeat
  namespace: example-web-app
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            access: example-web-app
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: docker.io/curlimages/curl:latest
              args:
                - "--retry"
                - "3"
                - "--retry-all-errors"   # Prevent the job from failing, e.g. during a rolling update
                - "--fail"
                - "--silent"
                - "--show-error"
                - "http://example-web-app:8080/"
