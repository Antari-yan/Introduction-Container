# Limiting of logging
x-logging: &logging
  driver: "json-file"
  options:
    max-file: "5"
    max-size: "10m"

services:
  web:
    image: simple_python_web_app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    environment:
      GREETING: "Hello from Docker Compose"
    healthcheck:
      test: wget -q --spider http://127.0.0.1:8080/healthz
    logging: *logging

  valkey:
    image: valkey/valkey:8-alpine
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: valkey-cli -h 127.0.0.1 -p 6379 ping
    logging: *logging


# # This is a small example in how to create a containerized Python application using a minimal WSGI app served by `gunicorn` and `valkey` as in-memory storage.
# # Run it from the project root
# docker build -t simple_python_web_app ./data/example-web-app
# docker compose -f compose-files/docker-compose.webapp-and-storage.yml up -d
# curl http://localhost:8080
# docker compose -f compose-files/docker-compose.webapp-and-storage.yml down
